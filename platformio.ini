; ============================================================================
;  Temperature & Humidity Monitoring + Automatic Fan Control System
;  Target: ESP32 (esp32dev) | Framework: Arduino core + ESP-IDF FreeRTOS
; ============================================================================

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; ---------------------------------------------------------------------------
; Build flags
; ---------------------------------------------------------------------------
build_flags =
    ; C++ standard for OOP / state machine
    -std=gnu++14
    ; C standard for ISRs / FreeRTOS native calls
    -std=gnu11
    ; Enable FreeRTOS native API (already linked by ESP-IDF, kept explicit)
    -DconfigUSE_TIMERS=1
    ; Core affinity: pin tasks to cores for deterministic scheduling
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
    ; Optimize for size (embedded)
    -Os
    ; Enable C++ exceptions only where needed (keep off for ISR safety)
    -fno-exceptions
    -fno-rtti
    ; Verbose warnings to catch stack/type issues early
    -Wall
    -Wextra

; ---------------------------------------------------------------------------
; Serial monitor
; ---------------------------------------------------------------------------
monitor_speed = 115200

; ---------------------------------------------------------------------------
; Upload / debug
; ---------------------------------------------------------------------------
upload_speed = 921600
board_build.flash_mode = dio
board_build.f_cpu = 240000000L
board_build.partitions = default.csv

; ---------------------------------------------------------------------------
; Libraries (Arduino core + ESP-IDF)
; ---------------------------------------------------------------------------
lib_deps =
    ; I2C sensor drivers (AHT20 / BME280)
    adafruit/Adafruit AHTX0 @ ^2.0.5
    adafruit/Adafruit BME280 Library @ ^2.2.4
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/Adafruit BusIO @ ^1.16.1
    ; LCD 20x4 I2C
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
    ; MQTT
    knolleary/PubSubClient @ ^2.8
    ; JSON
    bblanchon/ArduinoJson @ ^7.0.4

; ---------------------------------------------------------------------------
; Extra library storage (local lib/ folder)
; ---------------------------------------------------------------------------
lib_extra_dirs = lib
